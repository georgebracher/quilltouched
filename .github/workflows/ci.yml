# Quilltouched CI: the authoritative release gate (audit #8).
#
#   release : ONE authoritative gate. Ephemeral Postgres service, DATABASE_URL
#             set, then `make release-check`. That runs engine tests/, api/tests,
#             llm unit tests, the client build + lint, and Python ruff. It FAILS
#             on a zero-collection suite, a missing tool, and — because the DB
#             service is up — ANY DB-marked test that skips (a skipped DB test is
#             a broken gate, never a green one).
#             The engine tests/ and api/tests DB suites BOTH use the public
#             schema for the legacy shared world, so release-check runs them as
#             SEPARATE pytest invocations against SEPARATE scratch databases
#             (everquill_rc_engine_* / everquill_rc_api_*) that it creates on
#             this same server and drops afterward — otherwise they collide in
#             public (see docs/ops/release-gate.md). No workflow change is
#             needed: the gate owns the isolation. The `postgres` maintenance DB
#             (present in postgres:16) is used to CREATE/DROP the scratch DBs.
#   no-db   : the app must boot without DATABASE_URL, serve /healthz 200, and
#             degrade game endpoints to 503 (auth answers first: unauthed
#             POST /api/action is 410 — the shared world is sealed).
#
# `make release-check` is the single source of truth for what "green" means; run
# it locally too (docs/ops/release-gate.md). CI only supplies Postgres + tools.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    name: Release gate (engine + api + llm + client + ruff, ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: everquill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL is set, so `make release-check` runs the DB suites
      # authoritatively (zero-collection fails, ANY skip fails). The gate does
      # NOT run the suites against this database directly — it derives per-suite
      # scratch databases on the same server (user `postgres` is superuser, so
      # CREATE DATABASE works) so the engine and api public-schema worlds never
      # collide. See docs/ops/release-gate.md.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/everquill_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Install Python deps (engine + api)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[db,crypto,dev]" -r requirements.txt

      - name: Install client deps
        run: npm -C client ci

      - name: Release gate (make release-check)
        # PY=python: CI has no .venv; setup-python puts `python` on PATH.
        run: make release-check PY=python

  no-db:
    name: No-database mode (boot + degrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[db,crypto,dev]" -r requirements.txt

      - name: Test (no-DB mode — DB tests skip cleanly)
        run: |
          EVERQUILL_IGNORE_DOTENV=1 python -m pytest tests api/tests -rs

      - name: API boots clean without a database
        run: |
          EVERQUILL_IGNORE_DOTENV=1 python -m uvicorn api.main:app --port 8123 &
          APP_PID=$!
          up=""
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8123/healthz >/dev/null; then up=yes; break; fi
            sleep 0.5
          done
          [ "$up" = "yes" ] || { echo "FAILED: API never came up"; kill $APP_PID; exit 1; }
          body=$(curl -s http://127.0.0.1:8123/healthz)
          [ "$body" = "ok" ] || { echo "FAILED: /healthz body '$body' != 'ok'"; kill $APP_PID; exit 1; }
          scene=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8123/api/scene?world=harrowdown')
          [ "$scene" = "503" ] || { echo "FAILED: /api/scene without DB returned $scene, want 503"; kill $APP_PID; exit 1; }
          unauthed=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8123/api/action \
            -H 'content-type: application/json' \
            -d '{"command_id":"ci-probe-1","intent":{}}')
          [ "$unauthed" = "410" ] || { echo "FAILED: unauthed /api/action returned $unauthed, want 410 (shared world sealed)"; kill $APP_PID; exit 1; }
          authed=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8123/api/action \
            -H 'content-type: application/json' -H 'authorization: Bearer 0000' \
            -d '{"command_id":"ci-probe-2","intent":{}}')
          [ "$authed" = "503" ] || { echo "FAILED: authed /api/action without DB returned $authed, want 503"; kill $APP_PID; exit 1; }
          claim=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8123/api/claim \
            -H 'content-type: application/json' -d '{"invite_code":"x"}')
          [ "$claim" = "503" ] || { echo "FAILED: /api/claim without DB returned $claim, want 503"; kill $APP_PID; exit 1; }
          kill $APP_PID
          echo "PASSED: healthz ok, 410 seals the shared world, everything else degrades to 503"
